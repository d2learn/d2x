name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  XLINGS_VERSION: 0.4.51
  MCPP_VERSION: 0.0.104
  XLINGS_NON_INTERACTIVE: '1'

jobs:
  build-linux-mcpp:
    name: build (linux x86_64, mcpp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xlings
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash -s "v${XLINGS_VERSION}"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Refresh package index
        run: xlings update

      - name: Install workspace tools (.xlings.json -> mcpp ${{ env.MCPP_VERSION }})
        run: xlings install -y

      - name: Cache mcpp sandbox
        uses: actions/cache@v4
        with:
          path: ~/.xlings/data/xpkgs/xim-x-mcpp/${{ env.MCPP_VERSION }}/registry
          key: mcpp-sandbox-${{ runner.os }}-mcpp${{ env.MCPP_VERSION }}

      - name: Build with mcpp
        run: mcpp build

      - name: Verify d2x
        run: |
          binary=$(find target -name d2x -type f | head -1)
          test -n "$binary" || { echo "d2x binary not found"; find target -type f | head -20; exit 1; }
          chmod +x "$binary"
          "$binary" --version

      # 自有 e2e:fake-provider 驱动,零 mcpp/课程依赖——协议容错/推进/
      # 活性超时/单实例锁/flush 五组(tests/e2e.sh)。
      - name: Protocol conformance e2e (fake provider)
        run: |
          D2X="$PWD/$(find target -name d2x -type f | head -1)"
          D2X="$D2X" bash tests/e2e.sh

  build-macos:
    name: build (${{ matrix.os }}, mcpp)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Install xlings
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash -s "v${XLINGS_VERSION}"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Refresh package index
        run: xlings update

      - name: Install workspace tools (.xlings.json -> mcpp ${{ env.MCPP_VERSION }})
        run: xlings install -y

      - name: Build with mcpp
        run: mcpp build

      - name: Verify d2x
        run: |
          BIN=$(find target -name d2x -type f | head -1)
          test -n "$BIN" || { echo "d2x binary not found"; find target -type f | head -20; exit 1; }
          chmod +x "$BIN"
          "$BIN" --version

  build-windows:
    name: build (windows x86_64, mcpp)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xlings
        shell: pwsh
        run: |
          irm https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.ps1 | iex
          "$env:USERPROFILE\.xlings\subos\current\bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Build with mcpp
        shell: bash
        run: |
          set -e
          xlings update
          xlings install -y
          mcpp build
          D2X=$(find target -name 'd2x.exe' -type f | head -1)
          test -n "$D2X" || { echo "d2x.exe not found"; find target -type f | head -20; exit 1; }
          "$D2X" --version

  # Smoke test: a real `d2x checker` run against the d2mcpp course must reach
  # and report the FIRST exercise's build error within a bounded window, rather
  # than hanging on the init log (issue #24). The checker waits for file edits
  # forever, so a timeout kill is the expected, healthy outcome.
  checker-smoke:
    name: checker smoke (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xlings
        run: |
          curl -fsSL https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash -s "v${XLINGS_VERSION}"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"

      - name: Refresh package index
        run: xlings update

      - name: Build d2x with mcpp
        run: |
          xlings install -y
          mcpp build

      # d2mcpp 已迁移「练习即测试」(mcpp Provider);需要 mcpp >= 0.0.104。
      # TODO: d2mcpp PR #84 合入 main 后把 ref 切回默认分支。
      - name: Checkout d2mcpp course
        uses: actions/checkout@v4
        with:
          repository: mcpp-community/d2mcpp
          ref: feat/mcpp-provider
          path: d2mcpp

      # 按课程自己的 .xlings.json 安装 mcpp——xlings 的 workspace-pin shim
      # 解析只认经该路径安装的版本(全局 `xlings install mcpp@X` 不满足,
      # CI 实测 "version not found";已知 xlings 侧待改进项)。
      - name: Install course toolchain (per d2mcpp .xlings.json)
        run: cd d2mcpp && xlings install -y

      # 预热 + 可见诊断:不带 -q 构建 Provider——冷启动的工具链下载/构建
      # 全程可见;任何失败在这里直接暴露,而不是被 checker 的协议流吞掉。
      - name: Warm course provider (visible diagnostics)
        run: |
          cd d2mcpp
          mcpp build -p d2x/buildtools
          mcpp run -q -p d2x/buildtools -- describe

      - name: Run d2x checker (must reach first exercise, not hang on load)
        run: |
          D2X="$PWD/$(find target -name d2x -type f | head -1)"
          test -x "$D2X" || chmod +x "$D2X"
          cd d2mcpp
          # Force the print UI so output is plain text in a non-TTY runner.
          sed -i 's/"ui_backend": *"tui"/"ui_backend": "print"/' .d2x.json || true
          set +e
          timeout 120 "$D2X" checker --ui print --lang en > checker.out 2>&1
          code=$?
          set -e
          echo "checker exit=$code (124 = killed by timeout while waiting for edits = expected)"
          echo "------------------ checker output (tail) ------------------"
          tail -n 40 checker.out || true
          echo "-----------------------------------------------------------"
          if grep -q "hello-mcpp" checker.out && grep -qiE "error" checker.out; then
            echo "OK: checker reached and reported the first exercise (not stuck on the loading log)"
          else
            echo "FAIL: checker produced no exercise build output within the window (stuck on load?)"
            exit 1
          fi
